[project]
name = "qca-sdk"
version = "0.1.0"
description = "Typed synchronous and asynchronous clients for Qoder Cloud Agents"
authors = [{name = "Qoder"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["Qoder", "Cloud Agents", "Forward", "Managed"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.11,<3",
  "typing-extensions>=4.12,<5",
  "anyio>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "pydoc-markdown>=4,<5"]

[project.urls]
Repository = "https://github.com/QoderAI/qoder-cloud-agents-sdk-python"
Issues = "https://github.com/QoderAI/qoder-cloud-agents-sdk-python/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qca", "qca.*"]
exclude = ["*.__pycache__", "*.__pycache__.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: opt-in tests against a real Qoder account"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pydoc_markdown.*", "docspec.*"]
ignore_missing_imports = true
